name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (tests + lint)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civil
          POSTGRES_PASSWORD: civil
          POSTGRES_DB: civil_registry
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civil -d civil_registry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: create the test database
        env:
          PGPASSWORD: civil
        run: |
          psql -h localhost -U civil -d postgres \
            -c "CREATE DATABASE civil_registry_test OWNER civil"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: lint (ruff)
        run: ruff check app tests scripts alembic

      - name: format check (black)
        run: black --check app tests scripts alembic

      - name: tests
        env:
          ENVIRONMENT: testing
          TEST_DATABASE_URL: postgresql+psycopg://civil:civil@localhost:5432/civil_registry_test
          SECRET_KEY: ci-secret-key-not-used-in-production
          IMPORT_STORAGE_DIR: ${{ github.workspace }}/backend/.ci-uploads
        run: python -m pytest tests/ -v --cov=app --cov-report=term-missing

      - name: coverage floor
        run: coverage report --fail-under=80

  image:
    name: backend image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: docker build -f backend/Dockerfile -t civil-backend:ci .
      - name: smoke test the entrypoint
        run: |
          docker run --rm --entrypoint python civil-backend:ci \
            -c "from app.main import app; print('routes:', len(app.routes))"