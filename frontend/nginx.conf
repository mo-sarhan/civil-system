server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Import uploads are multi-megabyte CSV files; nginx defaults to 1 MB.
    client_max_body_size 200m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The SPA API. `proxy_pass` without a URI keeps the original path intact.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running exports must not be cut off by the default 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build output can be cached forever; index.html never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
